name: Deploy to Production

on:
  push:
    branches: [main]

# Never run two deploys at once; a newer push supersedes a queued one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml

  frontend-build:
    uses: ./.github/workflows/frontend-checks.yml

  deploy:
    name: Trigger production update
    runs-on: ubuntu-latest
    # Previously `needs: []`: every push to main reached production even when
    # the test suite was red.
    needs: [backend-tests, frontend-build]
    steps:
      - name: SSH and trigger update
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: touch ${{ secrets.PROD_PROJECT_DIR }}/.update_trigger
